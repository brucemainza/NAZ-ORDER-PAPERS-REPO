services:
  db:
    ports: !override []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-naz_order_papers}
    restart: unless-stopped

  migrate:
    image: naz-order-papers-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}

  backend:
    image: naz-order-papers-backend:${IMAGE_TAG:-latest}
    ports: !override []
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL is required}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma:300m}
    volumes: !override []

  worker:
    image: naz-order-papers-backend:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?OLLAMA_BASE_URL is required}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma:300m}

  frontend:
    image: naz-order-papers-frontend:${IMAGE_TAG:-latest}
    ports: !override
      - "127.0.0.1:3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_BACKEND_URL: ""
      BACKEND_INTERNAL_URL: http://backend:8000
      NODE_ENV: production
      SECURE_COOKIES: "true"
    volumes: !override []