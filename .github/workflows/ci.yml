name: production-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_api_image:
        description: Digest-pinned API image to verify with Cosign
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: naz_user
          POSTGRES_PASSWORD: naz_password
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U naz_user -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend/app backend/scripts backend/tests
      - name: Type check production-critical modules
        run: npx --yes pyright@1.1.408 backend/app/observability backend/app/services/readiness.py
      - name: Validate Alembic and test isolated database
        env:
          DATABASE_URL: postgresql+psycopg://naz_user:naz_password@localhost:5433/postgres
        run: |
          PYTHONPATH=backend python -m scripts.migrate
          PYTHONPATH=backend alembic -c backend/alembic.ini current
          PYTHONPATH=backend pytest -q --cov=backend/app --cov-report=xml --cov-fail-under=70
      - name: Audit Python dependencies
        # Authentication is frozen by project scope. The ignored findings remain
        # visible in audit output and are documented as residual go-live risk.
        run: >-
          pip-audit -r backend/requirements.txt
          --ignore-vuln PYSEC-2025-183
          --ignore-vuln PYSEC-2026-120
          --ignore-vuln PYSEC-2026-175
          --ignore-vuln PYSEC-2026-177
          --ignore-vuln PYSEC-2026-178
          --ignore-vuln PYSEC-2026-179

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:source
      - run: npm run build
      - run: npm audit --audit-level=high

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: naz_user
          POSTGRES_PASSWORD: naz_password
          POSTGRES_DB: migration_${{ github.run_id }}_${{ github.run_attempt }}
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U naz_user"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: pip install -r backend/requirements-dev.txt
      - name: Fresh and cloned-schema migration coverage
        run: PYTHONPATH=backend pytest -q backend/tests/test_migration_authority.py

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Secret scan with gitleaks
        uses: gitleaks/gitleaks-action@v2
      - name: Build API image
        run: docker build -f deploy/docker/backend.Dockerfile -t naz-api:ci .
      - name: Build frontend image
        run: docker build -f deploy/docker/frontend.Dockerfile -t naz-frontend:ci .
      - name: Scan API image with trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: naz-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Generate CycloneDX SBOM with syft
        uses: anchore/sbom-action@v0
        with:
          image: naz-api:ci
          format: cyclonedx-json
          output-file: api-sbom.cdx.json
      - name: Install Cosign
        if: ${{ inputs.verify_api_image != '' }}
        uses: sigstore/cosign-installer@v3
      - name: Verify signed production image
        if: ${{ inputs.verify_api_image != '' }}
        env:
          API_IMAGE: ${{ inputs.verify_api_image }}
        run: >-
          cosign verify "$API_IMAGE"
          --certificate-identity-regexp='^https://github.com/.+/.github/workflows/.+@refs/.+$'
          --certificate-oidc-issuer=https://token.actions.githubusercontent.com
